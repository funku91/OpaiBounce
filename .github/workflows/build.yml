name: Build LiquidBounce Legacy

on:
  push:
    branches: [ legacy, main, master ]
  pull_request:
    branches: [ legacy, main, master ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # 或 'zulu' / 'adopt'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Dev Workspace & Build
        run: ./gradlew --stacktrace setupDevWorkspace build
        # 对应 README 中的命令（去掉了 idea/eclipse，因为 CI 不需要 IDE 配置）

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBounce-Legacy-Build
          path: |
            build/libs/*.jar
            build/libs/zip/**
          if-no-files-found: warn